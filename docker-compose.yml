services:
    api:
        build:
            context: .
            dockerfile: docker/Dockerfile
        ports: ["8080:8080"]
        env_file: .env
        depends_on: [postgres, redis]

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: lullify
            POSTGRES_USER: lullify
            POSTGRES_PASSWORD: lullify_dev
        ports: ["5432:5432"]
        volumes: [pg_data:/var/lib/postgresql/data]

    redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

volumes:
    pg_data: