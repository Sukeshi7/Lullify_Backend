services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports: ["8080:8080"]
    env_file: .env
    depends_on: [postgres, redis, minio]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lullify
      POSTGRES_USER: lullify
      POSTGRES_PASSWORD: lullify_dev
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    container_name: lullify-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: lullify_admin
      MINIO_ROOT_PASSWORD: lullify_dev_secret_change_me
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  pg_data:
  minio_data: