openapi: "3.0.3"
info:
    title: Lullify API
    description: Real-time audio streaming backend for the Lullify radio platform.
    version: "1.0.0"
    contact:
        name: Lullify Team

servers:
    - url: https://lullifybackend-dev.up.railway.app/api/v1
      description: Production (Railway)
    - url: http://localhost:8080/api/v1
      description: Local development

tags:
    - name: Auth
      description: Authentication and session management
    - name: Streams
      description: Live stream management and HLS playback
    - name: Playlists
      description: Playlist CRUD
    - name: Tracks
      description: Track upload
    - name: Favorites
      description: User favorites
    - name: History
      description: Listening history
    - name: Admin
      description: Admin-only endpoints
    - name: Health
      description: Health checks

components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    schemas:
        Error:
            type: object
            properties:
                error:
                    type: string
            example:
                error: "unauthorized"

        User:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                username:
                    type: string
                email:
                    type: string
                    format: email
                role:
                    type: string
                    enum: [user, broadcaster, admin]

        Tokens:
            type: object
            properties:
                access_token:
                    type: string
                refresh_token:
                    type: string
                user:
                    $ref: "#/components/schemas/User"

        Stream:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                title:
                    type: string
                description:
                    type: string
                mount_point:
                    type: string
                status:
                    type: string
                    enum: [offline, live, ended]
                listener_count:
                    type: integer
                started_at:
                    type: string
                    format: date-time
                    nullable: true

        Playlist:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                owner_id:
                    type: string
                    format: uuid
                title:
                    type: string
                description:
                    type: string
                is_public:
                    type: boolean

        Track:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                playlist_id:
                    type: string
                    format: uuid
                title:
                    type: string
                artist:
                    type: string
                format:
                    type: string
                    enum: [mp3, flac, wav]
                size_bytes:
                    type: integer
                duration:
                    type: integer
                position:
                    type: integer

        Favorite:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                user_id:
                    type: string
                    format: uuid
                stream_id:
                    type: string
                    format: uuid
                created_at:
                    type: string
                    format: date-time

        HistoryEntry:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                user_id:
                    type: string
                    format: uuid
                track_title:
                    type: string
                artist:
                    type: string
                stream_id:
                    type: string
                    format: uuid
                    nullable: true
                played_at:
                    type: string
                    format: date-time

paths:
    # ── Auth ──────────────────────────────────────────────────────────────────

    /auth/register:
        post:
            tags: [Auth]
            summary: Register a new user
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [username, email, password]
                            properties:
                                username:
                                    type: string
                                email:
                                    type: string
                                    format: email
                                password:
                                    type: string
                                    minLength: 8
            responses:
                "201":
                    description: User created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tokens"
                "400":
                    description: Invalid input
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: Email already exists
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"

    /auth/login:
        post:
            tags: [Auth]
            summary: Login
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    format: email
                                password:
                                    type: string
            responses:
                "200":
                    description: Login successful
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tokens"
                "401":
                    description: Invalid credentials
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"

    /auth/refresh:
        post:
            tags: [Auth]
            summary: Refresh access token
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [refresh_token]
                            properties:
                                refresh_token:
                                    type: string
            responses:
                "200":
                    description: New tokens
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tokens"
                "401":
                    description: Invalid refresh token
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"

    /auth/logout:
        post:
            tags: [Auth]
            summary: Logout (client-side token invalidation)
            security:
                - BearerAuth: []
            responses:
                "204":
                    description: Logged out

    # ── Streams ───────────────────────────────────────────────────────────────

    /streams:
        get:
            tags: [Streams]
            summary: List active streams
            responses:
                "200":
                    description: List of live streams
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    streams:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Stream"
                                    total:
                                        type: integer

        post:
            tags: [Streams]
            summary: Create a stream (broadcaster only)
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [title, mount_point]
                            properties:
                                title:
                                    type: string
                                description:
                                    type: string
                                mount_point:
                                    type: string
            responses:
                "201":
                    description: Stream created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    stream:
                                        $ref: "#/components/schemas/Stream"
                "400":
                    description: Invalid input
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"

    /streams/{id}/start:
        post:
            tags: [Streams]
            summary: Start a stream
            security:
                - BearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                "200":
                    description: Stream started
                "401":
                    description: Unauthorized
                "403":
                    description: Not the stream owner
                "404":
                    description: Stream not found
                "409":
                    description: Stream already live

    /streams/{id}/stop:
        post:
            tags: [Streams]
            summary: Stop a stream
            security:
                - BearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                "200":
                    description: Stream stopped
                "401":
                    description: Unauthorized
                "403":
                    description: Not the stream owner
                "404":
                    description: Stream not found

    # ── Playlists ─────────────────────────────────────────────────────────────

    /playlists:
        post:
            tags: [Playlists]
            summary: Create a playlist
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [title]
                            properties:
                                title:
                                    type: string
                                description:
                                    type: string
                                is_public:
                                    type: boolean
            responses:
                "201":
                    description: Playlist created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Playlist"
                "401":
                    description: Unauthorized

        get:
            tags: [Playlists]
            summary: List my playlists
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: List of playlists
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    playlists:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Playlist"
                                    total:
                                        type: integer

    /playlists/{id}/tracks:
        post:
            tags: [Tracks]
            summary: Upload a track to a playlist
            security:
                - BearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [file, title, format]
                            properties:
                                file:
                                    type: string
                                    format: binary
                                title:
                                    type: string
                                artist:
                                    type: string
                                format:
                                    type: string
                                    enum: [mp3, flac, wav]
            responses:
                "201":
                    description: Track uploaded
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Track"
                "400":
                    description: Invalid input or file
                "403":
                    description: Not playlist owner
                "404":
                    description: Playlist not found
                "413":
                    description: File too large

    # ── Favorites ─────────────────────────────────────────────────────────────

    /favorites:
        get:
            tags: [Favorites]
            summary: List my favorites
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: List of favorites
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    favorites:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Favorite"
                                    total:
                                        type: integer

        post:
            tags: [Favorites]
            summary: Add a stream to favorites
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [stream_id]
                            properties:
                                stream_id:
                                    type: string
                                    format: uuid
            responses:
                "201":
                    description: Added to favorites
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Favorite"
                "409":
                    description: Already favorited

    /favorites/{streamId}:
        delete:
            tags: [Favorites]
            summary: Remove a stream from favorites
            security:
                - BearerAuth: []
            parameters:
                - name: streamId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                "204":
                    description: Removed from favorites
                "404":
                    description: Favorite not found

    # ── History ───────────────────────────────────────────────────────────────

    /history:
        get:
            tags: [History]
            summary: Get my listening history
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Listening history
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    history:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/HistoryEntry"
                                    total:
                                        type: integer

        post:
            tags: [History]
            summary: Record a listening event
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [track_title]
                            properties:
                                track_title:
                                    type: string
                                artist:
                                    type: string
                                stream_id:
                                    type: string
                                    format: uuid
            responses:
                "201":
                    description: History entry recorded
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/HistoryEntry"

    # ── Admin ─────────────────────────────────────────────────────────────────

    /admin/users:
        get:
            tags: [Admin]
            summary: List all users (admin only)
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: List of users
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    users:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/User"
                                    total:
                                        type: integer
                "403":
                    description: Admin access required

    /admin/users/{id}:
        delete:
            tags: [Admin]
            summary: Delete a user (admin only)
            security:
                - BearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                "204":
                    description: User deleted
                "400":
                    description: Cannot delete own account
                "403":
                    description: Admin access required
                "404":
                    description: User not found

    /admin/stats:
        get:
            tags: [Admin]
            summary: Get platform statistics (admin only)
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: Platform stats
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    total_users:
                                        type: integer
                                    admins:
                                        type: integer
                                    broadcasters:
                                        type: integer
                                    listeners:
                                        type: integer
                "403":
                    description: Admin access required

    # ── Health ────────────────────────────────────────────────────────────────

    /healthz:
        get:
            tags: [Health]
            summary: Liveness probe
            responses:
                "200":
                    description: Service is alive

    /readyz:
        get:
            tags: [Health]
            summary: Readiness probe (checks DB and Redis)
            responses:
                "200":
                    description: Service is ready
                "503":
                    description: Service not ready