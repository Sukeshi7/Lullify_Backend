global:
    scrape_interval: 15s
    evaluation_interval: 15s

scrape_configs:
    # Métriques de l'API Lullify
    - job_name: lullify-api
      static_configs:
          - targets: ["api:8080"]
      metrics_path: /metrics

    # Métriques de l'OTEL Collector
    - job_name: otel-collector
      static_configs:
          - targets: ["otel-collector:8889"]